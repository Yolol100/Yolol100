name: Profile README consistency

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/profile-readme-ci.yml
      - .github/scripts/profile_audit.py
      - .github/tests/test_profile_audit.py
  pull_request:
    paths:
      - README.md
      - .github/workflows/profile-readme-ci.yml
      - .github/scripts/profile_audit.py
      - .github/tests/test_profile_audit.py

permissions:
  contents: read

jobs:
  verify-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile profile validator and tests
        run: python3 -m py_compile .github/scripts/profile_audit.py .github/tests/test_profile_audit.py

      - name: Test normal and failure scenarios
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py' -v

      - name: Read canonical pins from governance repository
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 1 \
            --output pinned-config.json \
            https://raw.githubusercontent.com/Yolol100/.github/main/github-admin.json

      - name: Validate published profile against canonical pins
        run: python3 .github/scripts/profile_audit.py README.md pinned-config.json
